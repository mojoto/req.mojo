name: Run Tests

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "website/**"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "website/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 45 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-26]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential libcurl4-openssl-dev zlib1g-dev openssl

      - name: Install Pixi environment
        uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          pixi-version: v0.78.0
          locked: true

      - name: Install test dependencies
        run: make test-deps

      - name: Run unit tests
        run: make test

      - name: Precompile package
        run: make build

      - name: Verify isolated package consumers
        run: make test-package

      - name: Open temporary macOS SSH debug session
        id: debug
        if: always() && github.event_name == 'workflow_dispatch' && runner.os == 'macOS'
        uses: owenthereal/action-upterm@175d33786004a53b1538bcf157402b7197ce5029 # v2
        with:
          limit-access-to-actor: true
          detached: true
          upterm-version: v0.36.0
          wait-timeout-minutes: 20

      - name: Save SSH connection details
        if: always() && github.event_name == 'workflow_dispatch' && runner.os == 'macOS'
        env:
          SSH_COMMAND: ${{ steps.debug.outputs.ssh-command }}
        run: |
          mkdir -p build
          printf '%s\n' "$SSH_COMMAND" > build/debug-ssh.txt

      - name: Upload SSH connection details
        if: always() && github.event_name == 'workflow_dispatch' && runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-debug-ssh
          path: build/debug-ssh.txt
          retention-days: 1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-${{ matrix.os }}
          path: build/test-results.json
          if-no-files-found: warn
